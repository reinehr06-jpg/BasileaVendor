name: Deploy Frontend (build & push image)

# Builda a imagem Docker do frontend AQUI (GitHub Actions tem ~7 GB de RAM),
# em vez de compilar no servidor de 2 GB. O EasyPanel só puxa a imagem pronta.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow"

env:
  IMAGE: ghcr.io/reinehr06-jpg/basileavendor-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necessário para publicar no ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Opcional: dispara o redeploy no EasyPanel automaticamente após o push.
      # Só roda se você cadastrar o secret EASYPANEL_DEPLOY_WEBHOOK no repositório
      # (EasyPanel → serviço front_end → Deployments → Webhook).
      - name: Disparar redeploy no EasyPanel
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        if: ${{ env.WEBHOOK != '' }}
        run: curl -fsSL -X POST "$WEBHOOK"
