[supervisord]
; ================================================================
; SUPERVISOR — Usado no Docker Compose (local e VPS próprio).
; Se o deploy for no Render.com, use render.yaml (workers separados).
; NÃO use os dois ao mesmo tempo para evitar scheduler em duplicata.
; ================================================================
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler do Laravel — dispara os comandos agendados (comissoes:processar,
; asaas:process-events, sync, renovações, inadimplência, etc.). SEM isto, NADA
; agendado roda e a recorrência de comissão nunca é gerada.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker de fila — processa Jobs (e-mails, importações Asaas, análises).
[program:queue]
; --max-memory=128 reinicia o worker se ele passar de 128 MB, evitando que
; vazamentos de memória acumulem e derrubem o container num box de 2 GB.
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=128
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
