events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Limite de upload (formulários, importações de CSV, etc.)
    client_max_body_size 20M;

    # Compressão gzip para respostas de texto/JSON/HTML
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript;

    # Servidor HTTP na porta 80. O EasyPanel (ou qualquer proxy na borda)
    # termina o TLS e encaminha HTTP puro para o container nesta porta.
    server {
        listen 80;
        server_name _;

        # RAIZ = public/ do Laravel. É isto que faltava: sem apontar para public,
        # o nginx procurava arquivos estáticos e devolvia 404 em /api/login.
        root /var/www/html/public;
        index index.php;

        server_tokens off;

        # Todo request que não for arquivo existente cai no front controller.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Cache de estáticos
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # PHP via php-fpm
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 120;
        }
    }
}
