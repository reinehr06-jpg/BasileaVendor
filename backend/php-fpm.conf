[www]
user = www-data
group = www-data
listen = 9000

; Servidor de 2 GB compartilhado: cada processo PHP do Laravel usa ~40-80 MB.
; 20 filhos podiam consumir >1 GB sob carga e causar OOM. Usamos "ondemand"
; (só cria processo quando há request) e teto baixo para caber na memória.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 10s
pm.max_requests = 500
rlimit_files = 65535
